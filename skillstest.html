<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Test | Non-Metal Elements Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-card {
            max-width: 500px;
            width: 100%;
            background-color: #7d5c03;
            color: #cf9c04;
        }
        .result-box {
            border: 2px solid #dee2e6;
            border-radius: 10px;
            padding: 18px;
            background-color: #ffffff;
            text-align: left;
        }
    </style>
</head>
<body class="theme-skillstest">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ICT 10 Portfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Meet the Creator</a></li>
                    <li class="nav-item"><a class="nav-link" href="drill2.html">Drill 2</a></li>
                    <li class="nav-item"><a class="nav-link" href="seatwork1.html">Seatwork 1</a></li>
                    <li class="nav-item"><a class="nav-link active" href="skillstest.html">Skills Test</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-wrapper">
        <div class="container text-center d-flex flex-column align-items-center">
            <h1 class="text-white fw-bold mb-4">Non-Metal Elements Search</h1>

            <div class="card glass-card search-card p-4">
                <h3 class="mb-2 text-primary fw-bold">Non-Metal Elements</h3>
                <p class="text-muted mb-3">Enter an element symbol or name to search</p>

                <div class="mb-3">
                    <input type="text" id="elementInput" class="form-control form-control-lg text-center" placeholder="Example: H or Helium">
                </div>

                <button py-click="search_element" class="btn btn-primary btn-lg w-100 fw-semibold">Search Element</button>

                <div class="result-box mt-4 shadow-sm">
                    <h5 class="text-center fw-bold text-secondary mb-3">Showcase Result</h5>
                    <p class="mb-2"><strong>Element Symbol/Code:</strong> <span id="element_code" class="badge bg-primary fs-6">-</span></p>
                    <p class="mb-2"><strong>Element Name:</strong> <span id="element_name">-</span></p>
                    <p class="mb-2"><strong>Non-Metal Category:</strong> <span id="non_metal">-</span></p>
                    <p class="mb-0"><strong>Atomic Number:</strong> <span id="atomic_number">-</span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-center text-secondary py-3">
        <p class="mb-0">&copy; 2026 History Club </p>
    </footer>

    <!-- PyScript Logic -->
    <script type="py">
        import js

        non_metals = {
            "H": ("Hydrogen", "Reactive Non-metal", "1"),
            "HE": ("Helium", "Noble Gas", "2"),
            "C": ("Carbon", "Reactive Non-metal", "6"),
            "N": ("Nitrogen", "Reactive Non-metal", "7"),
            "O": ("Oxygen", "Reactive Non-metal", "8"),
            "F": ("Fluorine", "Reactive Non-metal / Halogen", "9"),
        }

        name_to_symbol = {val[0].upper(): key for key, val in non_metals.items()}

        def search_element(event):
            query = js.document.getElementById("elementInput").value.strip().upper()

            symbol = None
            if query in non_metals:
                symbol = query
            elif query in name_to_symbol:
                symbol = name_to_symbol[query]

            if symbol:
                name, category, atomic_num = non_metals[symbol]
                js.document.getElementById("element_code").innerText = symbol
                js.document.getElementById("element_name").innerText = name
                js.document.getElementById("non_metal").innerText = category
                js.document.getElementById("atomic_number").innerText = atomic_num
            else:
                js.document.getElementById("element_code").innerText = "N/A"
                js.document.getElementById("element_name").innerText = "Element not found"
                js.document.getElementById("non_metal").innerText = "-"
                js.document.getElementById("atomic_number").innerText = "-"
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
